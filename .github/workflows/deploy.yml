name: Deploy Infrastructure

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Docker Context (PROD)
        run: |
               mkdir -p ~/.docker
          # Используем printf для надежной записи, включая новые строки
          printf "%s\n" "${{ secrets.DOCKER_CA_PROD }}" > ~/.docker/ca.pem
          printf "%s\n" "${{ secrets.DOCKER_CERT_PROD }}" > ~/.docker/cert.pem
          printf "%s\n" "${{ secrets.DOCKER_KEY_PROD }}" > ~/.docker/key.pem
          chmod 600 ~/.docker/*
      
      - name: Deploy to Prod
        run: |
          docker context create prod --docker "host=tcp://172.16.170.139:2376,ca=~/.docker/ca.pem,cert=~/.docker/cert.pem,key=~/.docker/key.pem" || true
          docker context use prod
          docker stack deploy -c docker-compose.prod.yml shared-services-prod

  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Docker Context (DEV)
        run: |
          mkdir -p ~/.docker
          # Используем printf для надежной записи, включая новые строки
          printf "%s\n" "${{ secrets.DOCKER_CA_DEV }}" > ~/.docker/ca.pem
          printf "%s\n" "${{ secrets.DOCKER_CERT_DEV }}" > ~/.docker/cert.pem
          printf "%s\n" "${{ secrets.DOCKER_KEY_DEV }}" > ~/.docker/key.pem
          chmod 600 ~/.docker/*
      
      - name: Deploy to Dev
        run: |
          docker context create dev --docker "host=tcp://172.16.170.138:2376,ca=~/.docker/ca.pem,cert=~/.docker/cert.pem,key=~/.docker/key.pem" || true
          docker context use dev
          docker stack deploy -c docker-compose.dev.yml shared-services-dev
